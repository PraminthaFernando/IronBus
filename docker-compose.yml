services:
  postgres:
    image: postgres:16-alpine
    container_name: ironbus-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ironbus}
      POSTGRES_USER: ${POSTGRES_USER:-ironbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ironbus_local_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ironbus} -d ${POSTGRES_DB:-ironbus}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend/booking
      dockerfile: Dockerfile

    container_name: ironbus-backend
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ironbus}
      DATABASE_USERNAME: ${POSTGRES_USER:-ironbus}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-ironbus}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      APP_VERSION: ${APP_VERSION:-dev}

      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-true}
      OPENAPI_DOCS_ENABLED: ${OPENAPI_DOCS_ENABLED:-true}

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: ./frontend/booking-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    container_name: ironbus-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: