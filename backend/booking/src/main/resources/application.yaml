spring:
  application:
    name: train-seat-booking

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ironbus}
    username: ${DB_USERNAME:ironbus}
    password: ${DB_PASSWORD:ironbus}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

  fare:
    currency: LKR
    base-fare: 100.00
    price-per-km: 8.00
    minimum-fare: 150.00
    class-multipliers:
      FIRST_CLASS: 1.75
      SECOND_CLASS: 1.25
      THIRD_CLASS: 1.00

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
            - diskSpace

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

  info:
    env:
      enabled: true

ironbus:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  booking:
    reference-prefix: ${BOOKING_REFERENCE_PREFIX:IB}
    cancellation-cutoff: ${BOOKING_CANCELLATION_CUTOFF:PT1H}

  cors:
    allowed-origins:
      - ${FRONTEND_URL:http://localhost:3000}
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - Accept
      - X-Trace-Id
      - Idempotency-Key
    exposed-headers:
      - Location
      - X-Trace-Id
    allow-credentials: false
    max-age-seconds: 3600

  openapi:
    title: IronBus Booking API
    description: Segment-based railway seat booking API
    version: ${APP_VERSION:1.0.0}
    server-url: ${PUBLIC_API_URL:http://localhost:8080}

logging:
  pattern:
    console: >-
      %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}
      %-5level
      traceId=%X{traceId:-none}
      [%thread]
      %logger{36}
      - %msg%n

  level:
    root: INFO
    com.lsf.ironbus: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN