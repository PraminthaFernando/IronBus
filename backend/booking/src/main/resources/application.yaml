spring:
  application:
    name: train-seat-booking

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ironbus}
    username: ${DB_USERNAME:ironbus}
    password: ${DB_PASSWORD:ironbus}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true