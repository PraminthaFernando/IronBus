spring:
  application:
    name: train-seat-booking

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ironbus}
    username: ${DB_USERNAME:ironbus}
    password: ${DB_PASSWORD:ironbus}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}

  fare:
    currency: LKR
    base-fare: 100.00
    price-per-km: 8.00
    minimum-fare: 150.00
    class-multipliers:
      FIRST_CLASS: 1.75
      SECOND_CLASS: 1.25
      THIRD_CLASS: 1.00

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE